<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantView - 本地数据分析助手</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root {
    --primary: #1a56db;
    --primary-hover: #1e40af;
    --primary-light: #e8f0fe;
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --success: #16a34a;
    --error: #dc2626;
    --warning: #d97706;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    --upload-bg: #fafbfc;
    --upload-has-file-bg: #f0fdf4;
    --file-item-bg: #f8fafc;
    --result-bg: #fafbfc;
    --input-bg: #ffffff;
    --btn-secondary-bg: #ffffff;
    --focus-ring: rgba(26,86,219,0.1);
  }

  [data-theme="dark"] {
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-light: #1e3a5f;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --success: #22c55e;
    --error: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --upload-bg: #1e293b;
    --upload-has-file-bg: #0f2a1e;
    --file-item-bg: #1e293b;
    --result-bg: #1e293b;
    --input-bg: #1e293b;
    --btn-secondary-bg: #1e293b;
    --focus-ring: rgba(59,130,246,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
  }

  /* ── Header ── */
  .header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.3px;
  }
  .header-brand svg { width: 28px; height: 28px; flex-shrink: 0; }
  .header-badge {
    font-size: 11px;
    font-weight: 500;
    background: var(--primary-light);
    color: var(--primary);
    padding: 3px 10px;
    border-radius: 99px;
    letter-spacing: 0.3px;
  }
  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 7px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    line-height: 0;
  }
  .theme-toggle:hover { color: var(--primary); border-color: var(--primary); }
  .theme-toggle .icon-moon { display: none; }
  .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  /* ── Security Banner ── */
  .security-banner {
    background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius);
    margin: 24px 32px 0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #1e40af;
  }
  .security-banner svg { flex-shrink: 0; }

  /* ── Main Layout ── */
  .main-container {
    max-width: 1720px;
    margin: 0 auto;
    padding: 16px 32px 24px;
    height: calc(100vh - 160px);
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
  }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* ── Upload Zone ── */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--upload-bg);
  }
  .upload-zone:hover,
  .upload-zone.drag-over {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .upload-zone.has-file {
    border-style: solid;
    border-color: var(--success);
    background: var(--upload-has-file-bg);
  }
  .upload-icon {
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .upload-zone:hover .upload-icon,
  .upload-zone.drag-over .upload-icon {
    color: var(--primary);
  }
  .upload-text {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .upload-text strong {
    color: var(--primary);
    font-weight: 600;
  }
  .upload-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .file-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .file-info .remove-file {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    transition: color 0.15s;
    margin-left: 4px;
  }
  .file-info .remove-file:hover { color: var(--error); }
  #fileInput { display: none; }
  .file-list { margin-top: 12px; }
  .file-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--file-item-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .file-list-item .file-item-name { font-weight: 500; color: var(--text); flex: 1; }
  .file-list-item .file-item-size { color: var(--text-muted); margin: 0 12px; white-space: nowrap; }
  .file-list-item .file-item-badge {
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 1px 8px;
    border-radius: 99px;
    margin-right: 8px;
    white-space: nowrap;
  }
  .file-list-item .file-item-remove {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .file-list-item .file-item-remove:hover { color: var(--error); }
  .file-list-summary {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
    text-align: center;
  }

  /* ── Question Input ── */
  .question-input {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--input-bg);
    resize: vertical;
    transition: border-color 0.2s;
    line-height: 1.7;
  }
  .question-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .question-input::placeholder { color: var(--text-muted); }

  /* ── Submit Button ── */
  .btn-submit {
    width: 100%;
    padding: 13px 24px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }
  .btn-submit:hover { background: var(--primary-hover); box-shadow: var(--shadow-md); }
  .btn-submit:active { transform: translateY(1px); }
  .btn-submit:disabled {
    background: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  .btn-submit.btn-stop {
    background: var(--error);
  }
  .btn-submit.btn-stop:hover {
    background: #b91c1c;
  }

  /* ── Loading ── */
  .loading-container {
    display: none;
    text-align: center;
    padding: 32px 20px;
  }
  .loading-container.active { display: block; }

  .spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .loading-hint {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .loading-progress {
    width: 100%;
    max-width: 300px;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin: 16px auto 0;
    overflow: hidden;
  }
  .loading-progress-bar {
    height: 100%;
    background: var(--primary);
    border-radius: 99px;
    width: 10%;
    animation: progress-indeterminate 2s ease-in-out infinite;
  }
  @keyframes progress-indeterminate {
    0% { width: 10%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 10%; margin-left: 90%; }
  }

  /* ── Result ── */
  .result-section { display: none; }
  .result-section.active { display: block; }

  .result-content {
    background: var(--result-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.85;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--text);
  }
  /* ── 滚动条美化：细圆角、跟随主题色（WebKit / Firefox） ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* ── 分析模式徽标（单节点 / 分布式） ── */
  .analysis-meta {
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: var(--radius);
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .analysis-meta.active { display: flex; }
  .meta-pill {
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 12px;
  }
  .meta-pill.meta-single { background: var(--primary-light); color: var(--primary); }
  .meta-pill.meta-distributed { background: #fef3c7; color: #b45309; }
  [data-theme="dark"] .meta-pill.meta-distributed { background: #3b2f10; color: #fbbf24; }
  .meta-progress { margin-left: auto; font-variant-numeric: tabular-nums; }
  .meta-progress-wrap {
    flex: 1;
    min-width: 140px;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .meta-progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 0.3s ease;
  }
  .meta-progress-bar.indeterminate {
    width: 35%;
    animation: meta-progress-slide 1.2s ease-in-out infinite;
  }
  @keyframes meta-progress-slide {
    0% { margin-left: -35%; }
    100% { margin-left: 100%; }
  }

  /* ── Think block (collapsible) ── */
  .think-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    background: var(--bg);
  }
  .think-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .think-toggle:hover { background: var(--primary-light); }
  .think-toggle .arrow {
    transition: transform 0.2s;
    font-size: 10px;
    flex-shrink: 0;
  }
  .think-block.open .think-toggle .arrow { transform: rotate(90deg); }
  .think-content {
    display: none;
    padding: 0 14px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--text-muted);
    max-height: 400px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin: 0 14px;
  }
  .think-block.open .think-content { display: block; }
  .think-badge {
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 1px 8px;
    border-radius: 99px;
    margin-left: auto;
    white-space: nowrap;
  }
  .output-block {
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.85;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--text);
  }
  .output-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Markdown output styles ── */
  .output-block h1 { font-size: 1.5em; margin: 0.8em 0 0.4em; font-weight: 700; color: var(--text); }
  .output-block h2 { font-size: 1.3em; margin: 0.7em 0 0.3em; font-weight: 700; color: var(--text); }
  .output-block h3 { font-size: 1.15em; margin: 0.6em 0 0.25em; font-weight: 600; color: var(--text); }
  .output-block h4 { font-size: 1.05em; margin: 0.5em 0 0.2em; font-weight: 600; color: var(--text); }
  .output-block p { margin: 0.5em 0; }
  .output-block ul, .output-block ol { margin: 0.5em 0; padding-left: 1.8em; }
  .output-block li { margin: 0.2em 0; }
  .output-block strong { font-weight: 700; color: var(--text); }
  .output-block em { font-style: italic; }
  .output-block code {
    background: var(--primary-light);
    color: var(--primary-hover);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.9em;
  }
  .output-block pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 14px 18px;
    border-radius: var(--radius);
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.88em;
    line-height: 1.6;
    margin: 0.8em 0;
  }
  .output-block pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }
  .output-block table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.8em 0;
    font-size: 0.95em;
  }
  .output-block th {
    background: var(--bg);
    font-weight: 600;
    text-align: left;
    padding: 8px 12px;
    border: 1px solid var(--border);
  }
  .output-block td {
    padding: 7px 12px;
    border: 1px solid var(--border);
  }
  .output-block tr:nth-child(even) td { background: rgba(0,0,0,0.02); }
  [data-theme="dark"] .output-block tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
  .output-block hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .output-block a { color: var(--primary); text-decoration: underline; }
  .output-block blockquote {
    border-left: 3px solid var(--primary);
    padding: 4px 14px;
    margin: 0.8em 0;
    color: var(--text-secondary);
    background: var(--bg);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  .charts-container { margin-top: 20px; }
  .chart-item {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card-bg);
  }
  .chart-item-header {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .chart-item img {
    width: 100%;
    display: block;
    padding: 8px;
    box-sizing: border-box;
  }

  .result-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn-secondary {
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--btn-secondary-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-secondary:hover {
    color: var(--primary);
    border-color: var(--primary);
  }

  /* ── Error / Alert ── */
  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    display: none;
  }
  .alert.active { display: block; }
  .alert-error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
  }
  .alert-success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 24px 32px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── Dark Mode overrides ── */
  [data-theme="dark"] .security-banner {
    background: linear-gradient(135deg, #1e3a5f 0%, #0f2a1e 100%);
    border-color: #1e3a5f;
    color: #93c5fd;
  }
  [data-theme="dark"] .alert-error {
    background: #2d1215;
    border-color: #7f1d1d;
    color: #fca5a5;
  }
  [data-theme="dark"] .alert-success {
    background: #0f2a1e;
    border-color: #166534;
    color: #86efac;
  }
  /* ── 三栏布局：左输入 / 中节点工作 / 右成品，各列独立滚动 ── */
  .main-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(300px, 360px) minmax(340px, 1fr) minmax(380px, 1fr);
    gap: 20px;
    align-items: stretch;
  }
  .col-left, .col-mid, .col-right {
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
    padding-right: 6px;
  }
  .node-pane { display: flex; flex-direction: column; }
  .node-pane .card-title { flex-shrink: 0; }
  .node-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 200px;
  }
  .node-placeholder {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  /* ── 二次追问聊天面板（悬浮窗：固定在视口右下角，激活即可见，不依赖滚动） ── */
  .chat-panel {
    display: none;
    flex-direction: column;
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: min(460px, calc(100vw - 48px));
    max-height: 62vh;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card-bg);
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
    z-index: 999;
  }
  .chat-panel.active { display: flex; }
  .chat-panel .card-title {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chat-close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
  }
  .chat-close-btn:hover { color: var(--text); }
  /* 追问悬浮球：面板收起时出现在右下角，点击调出面板 */
  .chat-ball {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    z-index: 998;
    transition: transform 0.15s;
    border: none;
    padding: 0;
  }
  .chat-ball.show { display: flex; }
  .chat-ball:hover { transform: scale(1.08); }
  .chat-thread {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 120px;
    max-height: calc(62vh - 110px);
    overflow-y: auto;
  }
  .chat-msg {
    max-width: 92%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .chat-msg.user { align-self: flex-end; background: var(--primary); color: #fff; }
  .chat-msg.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .chat-input-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--input-bg);
    color: var(--text);
    font-size: 13px;
  }
  .chat-input-row input:focus { outline: none; border-color: var(--primary); }
  .node-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--result-bg);
  }
  .node-card-header {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-card-body {
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text);
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  @media (max-width: 1200px) {
    .main-container { height: auto; overflow: visible; }
    .main-grid { grid-template-columns: 1fr; }
    .col-left, .col-mid, .col-right { overflow-y: visible; padding-right: 0; }
    .node-pane { max-height: none; }
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .header { padding: 0 16px; }
    .main-container { padding: 16px; }
    .security-banner { margin: 16px 16px 0; }
    .card { padding: 16px; }
    .upload-zone { padding: 24px 16px; }
  }
</style>
</head>
<body>

<!-- Header -->

      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>

  <!-- Step 1: Upload -->

        下载 MD
      </button>
      <button class="btn-secondary" id="downloadWordBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="6" y1="7" x2="18" y2="7"/><line x1="6" y1="11" x2="18" y2="11"/><line x1="10" y1="15" x2="18" y2="15"/></svg>
        下载 Word

      <button class="btn-secondary" id="newAnalysisBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>

    <input type="file" id="importSessionFile" accept=".json,application/json" style="display:none">

  <!-- 二次追问（聊天，悬浮窗） -->

    <div class="chat-thread" id="chatThread"></div>

      <input type="text" id="chatInput" placeholder="数据有疑问或回答不到位？继续追问…（Enter 发送）">

</div><!-- /main-grid -->

<footer class="footer">

</footer>

<script>
console.log('[QuantView] JS loaded');
(function () {
  console.log('[QuantView] IIFE running');
  // ── Dark Mode ──
  var STORAGE_KEY = 'deepanalyze-theme';
  var html = document.documentElement;

  function getPreferredTheme() {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    if (theme === 'dark') {
      html.setAttribute('data-theme', 'dark');
    } else {
      html.removeAttribute('data-theme');
    }
  }

  function toggleTheme() {
    var current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem(STORAGE_KEY, next);
  }

  // Init on load
  applyTheme(getPreferredTheme());

  // ── DOM refs ──
  const themeToggle = document.getElementById('themeToggle');
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const questionInput = document.getElementById('questionInput');
  const submitBtn = document.getElementById('submitBtn');
  const loadingContainer = document.getElementById('loadingContainer');
  const errorAlert = document.getElementById('errorAlert');
  const resultSection = document.getElementById('resultSection');
  const resultContent = document.getElementById('resultContent');
  const chartsContainer = document.getElementById('chartsContainer');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const newAnalysisBtn = document.getElementById('newAnalysisBtn');

  let selectedFiles = [];

  // ── Helpers ──
  function formatFileSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function showError(msg) {
    errorAlert.textContent = msg;
    errorAlert.classList.add('active');
  }

  function hideError() {
    errorAlert.classList.remove('active');
    errorAlert.textContent = '';
  }

  function resetUI() {
    loadingContainer.classList.remove('active');
    resultSection.classList.remove('active');
    resultContent.textContent = '';
    chartsContainer.innerHTML = '';
    hideError();
    clearMetaBadge();
    midReset('等待分析…');
    chatReset();
    currentSession = null;
    setSubmitMode(false);
  }

  function setLoading(loading) {
    if (loading) {
      submitBtn.disabled = true;
      submitBtn.textContent = '分析中...';
      loadingContainer.classList.add('active');
      resultSection.classList.remove('active');
      hideError();
    } else {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始分析';
      loadingContainer.classList.remove('active');
    }
  }

  function getFileExtension(name) {
    return name.split('.').pop().toLowerCase();
  }

  function isValidFileType(name) {
    var ext = getFileExtension(name);
    return ext === 'xlsx' || ext === 'xls' || ext === 'csv' || ext === 'pdf';
  }

  // ── Render file list ──
  function renderFileList() {
    fileList.innerHTML = '';
    if (selectedFiles.length === 0) {
      uploadZone.classList.remove('has-file');
      return;
    }
    uploadZone.classList.add('has-file');

    var totalSize = 0;
    selectedFiles.forEach(function (f, idx) {
      totalSize += f.size;

      var item = document.createElement('div');
      item.className = 'file-list-item';

      var badge = document.createElement('span');
      badge.className = 'file-item-badge';
      badge.textContent = f.name.split('.').pop().toUpperCase();

      var nameSpan = document.createElement('span');
      nameSpan.className = 'file-item-name';
      nameSpan.textContent = f.name;

      var sizeSpan = document.createElement('span');
      sizeSpan.className = 'file-item-size';
      sizeSpan.textContent = formatFileSize(f.size);

      var removeBtn = document.createElement('span');
      removeBtn.className = 'file-item-remove';
      removeBtn.innerHTML = '&times;';
      removeBtn.title = '移除';
      removeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        selectedFiles.splice(idx, 1);
        renderFileList();
        // Reset fileInput if all removed
        if (selectedFiles.length === 0) {
          fileInput.value = '';
        }
      });

      item.append(badge, nameSpan, sizeSpan, removeBtn);
      fileList.appendChild(item);
    });

    // Summary line
    if (selectedFiles.length > 1) {
      var summary = document.createElement('div');
      summary.className = 'file-list-summary';
      summary.textContent = '已选择 ' + selectedFiles.length + ' 个文件，共 ' + formatFileSize(totalSize);
      fileList.appendChild(summary);
    }
  }

  // ── Add files ──
  function addFiles(fileArray) {
    hideError();
    var added = false;
    for (var i = 0; i < fileArray.length; i++) {
      var file = fileArray[i];
      if (!file) continue;
      if (!isValidFileType(file.name)) {
        showError('不支持的文件格式: ' + file.name + '，仅支持 .xlsx / .xls / .csv');
        continue;
      }
      // Avoid duplicates by name+size
      var dup = selectedFiles.some(function (f) {
        return f.name === file.name && f.size === file.size;
      });
      if (!dup) {
        selectedFiles.push(file);
        added = true;
      }
    }
    if (added) renderFileList();
    // 用户动了文件选择 → 视为要发起新分析，退出追问模式
    setSubmitMode(false);
  }

  // ── Events ──
  uploadZone.addEventListener('click', function () {
    fileInput.click();
  });

  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length > 0) {
      addFiles(Array.from(fileInput.files));
      fileInput.value = '';
    }
  });

  uploadZone.addEventListener('dragover', function (e) {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });

  uploadZone.addEventListener('dragleave', function () {
    uploadZone.classList.remove('drag-over');
  });

  uploadZone.addEventListener('drop', function (e) {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      addFiles(Array.from(e.dataTransfer.files));
    }
  });

  // ── Streaming Submit ──
  var currentAbortController = null;

  // 提交按钮双模式：报告完成后自动切到"追问"（输入问题直接追问），
  // 更换文件或新建分析后回到"开始分析"
  function setSubmitMode(followup) {
    submitBtn.dataset.followup = followup ? '1' : '0';
    questionInput.placeholder = followup
      ? '报告已完成：输入问题直接追问（或先点"新建分析"再发起新分析）'
      : '请描述您想要分析的内容...';
    submitBtn.innerHTML = followup
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> 追问'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始分析';
  }

  submitBtn.addEventListener('click', function () {
    // 追问模式：报告已完成且会话有效时，主输入框直接发追问
    if (submitBtn.dataset.followup === '1' && chatSessionId && currentSession) {
      var q2 = questionInput.value.trim();
      if (!q2) {
        // 输入为空 → 视为"打开追问面板"（面板可能被 × 收起过），聚焦聊天输入框
        var cp0 = document.getElementById('chatPanel');
        if (cp0) cp0.classList.add('active');
        var ci0 = document.getElementById('chatInput');
        if (ci0) setTimeout(function () { ci0.focus(); }, 100);
        syncChatBall();
        return;
      }
      questionInput.value = '';
      diagLog('点击追问按钮 → chatSend: ' + q2);
      chatSend(q2);
      return;
    }
    diagLog('按钮点击但非追问分支 followup=' + submitBtn.dataset.followup + ' session=' + !!chatSessionId + ' cur=' + !!currentSession);
    if (selectedFiles.length === 0) {
      showError('请先选择要分析的数据文件');
      return;
    }

    var question = questionInput.value.trim();
    if (!question) {
      showError('请输入分析需求');
      return;
    }

    hideError();
    resultSection.classList.remove('active');
    chartsContainer.innerHTML = '';
    clearMetaBadge();
    midReset('等待分析…');
    chatReset();
    currentSession = null;
    setSubmitMode(false);

    // Show streaming indicator
    loadingContainer.innerHTML = '<div class="spinner"></div>' +
      '<div class="loading-text" id="streamStatus">正在分析…</div>';
    loadingContainer.classList.add('active');
    submitBtn.disabled = false;
    submitBtn.textContent = '停止分析';
    submitBtn.classList.add('btn-stop');

    // Prepare result area for streaming
    resultContent.innerHTML = '<div class="output-block" id="streamOutput" style="min-height:60px;color:var(--text-muted);">等待模型响应…</div>';
    resultSection.classList.add('active');
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    var formData = new FormData();
    selectedFiles.forEach(function (f) {
      formData.append('files', f);
    });
    formData.append('question', question);

    var controller = new AbortController();
    currentAbortController = controller;

    var fullText = '';
    var thinkText = '';
    var inThink = true;  // GGUF: first chunks are think; switches to false on </think>
    var thinkOpener = '<think>';
    var thinkCloser = '</think>';
    var thinkBuf = '';   // sliding buffer for cross-chunk boundary detection
    var currentMeta = null;
    var lastProgress = null;
    function getStreamOutput() { return document.getElementById('streamOutput'); }

    function findThinkEnd(text) {
      // Check multiple patterns for think block termination
      var patterns = [thinkCloser, '<Answer>', '<answer>'];
      var idx = -1;
      var matchLen = 0;
      for (var i = 0; i < patterns.length; i++) {
        var pos = text.indexOf(patterns[i]);
        if (pos !== -1 && (idx === -1 || pos < idx)) {
          idx = pos;
          matchLen = patterns[i].length;
        }
      }
      // Regex fallback
      if (idx === -1) {
        var m = text.match(/<\s*\/\s*think\s*>/i);
        if (m) { idx = m.index; matchLen = m[0].length; }
      }
      if (idx === -1) {
        var m2 = text.match(/<\s*Answer\s*>/i);
        if (m2) { idx = m2.index; matchLen = m2[0].length; }
      }
      return idx === -1 ? null : { idx: idx, len: matchLen };
    }

    // Build think block during streaming
    function ensureThinkBlock() {
      var tb = document.getElementById('liveThinkBlock');
      if (!tb && thinkText) {
        tb = document.createElement('div');
        tb.id = 'liveThinkBlock';
        tb.className = 'think-block open';
        tb.innerHTML =
          '<button class="think-toggle"><span class="arrow">&#9660;</span> 思考过程 <span class="think-badge" id="liveThinkBadge">0 字</span></button>' +
          '<div class="think-content" id="liveThinkContent"></div>';
        var toggle = tb.querySelector('.think-toggle');
        toggle.addEventListener('click', function () { tb.classList.toggle('open'); });
        // Insert at top
        if (resultContent.firstChild) {
          resultContent.insertBefore(tb, resultContent.firstChild);
        } else {
          resultContent.appendChild(tb);
        }
      }
      return tb;
    }

    fetch('/analyze/stream', {
      method: 'POST',
      body: formData,
      signal: controller.signal
    }).then(function (response) {
      if (!response.ok) {
        return response.json().then(function (err) {
          throw new Error(err.error || 'HTTP ' + response.status);
        });
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var gotDone = false;

      function read() {
        return reader.read().then(function (result) {
          if (result.done) {
            // 流结束但从未收到 done 事件 → 服务端异常/连接断开，给出提示并复位按钮
            if (!gotDone) {
              loadingContainer.classList.remove('active');
              submitBtn.disabled = false;
              submitBtn.classList.remove('btn-stop');
              submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始分析';
              showError('分析意外中断（未收到完成信号）：可能是模型异常或连接断开，已中止后台任务，可重试。');
            }
            return;
          }

          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop();

          lines.forEach(function (line) {
            if (!line.startsWith('data: ')) return;
            var dataStr = line.substring(6);
            try {
              var data = JSON.parse(dataStr);
            } catch (e) { return; }

            if (data.type === 'meta') {
              currentMeta = data;
              chatSessionId = data.session || null;
              renderMetaBadge(data);
              // 一律逐表处理（split=true）：中栏实时显示各表卡片，右栏完成时整体显示
              midReset('等待任务分发…');
              var so = document.getElementById('streamOutput');
              if (so) so.innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center;">分项分析进行中…完成后在此显示完整报告</div>';
            } else if (data.type === 'progress') {
              lastProgress = data;
              updateMetaProgress(data);
            } else if (data.type === 'think') {
              thinkText += data.content;
              inThink = false;  // SSE think events → text stream is output
              ensureThinkBlock();
              var tc = document.getElementById('liveThinkContent');
              var tb = document.getElementById('liveThinkBadge');
              if (tc) tc.textContent = thinkText;
              if (tb) tb.textContent = thinkText.length + ' 字';
            } else if (data.type === 'text') {
              var chunk = data.content;

              // 中栏：节点工作内容（必须用原始内容检测——思考禁用时
              // 正文会被下方 inThink 缓冲区吞掉，导致中栏收不到小节）
              // try/catch：渲染异常不掐断读流
              try {
                if (currentMeta && currentMeta.split) {
                  var mSec = chunk.match(/^### 工作表「(.+?)」分析（节点：(.+?)）$/m);
                  var mOv = chunk.match(/^## 总览与综合结论/m);
                  if (mSec) {
                    midCurrent = midAddCard(mSec[1], mSec[2], chunk.replace(/^### 工作表「(.+?)」分析（节点：(.+?)）\n/m, ''));
                    midRender();
                  } else if (mOv) {
                    midCurrent = midAddCard('总览与综合结论', '主节点', chunk.replace(/^## 总览与综合结论（主节点生成）\n/m, ''));
                    midRender();
                  } else if (midCurrent) {
                    midCurrent.raw += chunk;
                    midCurrent.dirty = true;
                    if (!window._midTimer) {
                      window._midTimer = setTimeout(function () {
                        window._midTimer = null;
                        midRender();
                      }, 300);
                    }
                  }
                }
              } catch (e) { console.error('[stream] 中栏渲染异常', e); }

              if (inThink) {
                var hasThinkMarker = chunk.indexOf('<think') !== -1;
                // 思考已禁用且首个正文块无思考标记 → 直接按正文处理，不再吞入思考缓冲区
                if (thinkText === '' && !hasThinkMarker && chunk.trim() !== '') {
                  inThink = false;
                } else {
                  // Strip leading <think> from first chunk
                  if (thinkText === '' && chunk.indexOf(thinkOpener) === 0) {
                    chunk = chunk.substring(thinkOpener.length);
                  }
                  // Accumulate into sliding buffer for cross-chunk boundary detection
                  thinkBuf += chunk;
                  thinkText += chunk;
                  chunk = '';

                  // Search for think end in the buffer (last 200 chars to avoid O(n²))
                  var searchStart = Math.max(0, thinkBuf.length - 200);
                  var searchText = thinkBuf.substring(searchStart);
                  var result = findThinkEnd(searchText);

                  if (result) {
                    // Found the boundary — rewind thinkText to before the tag
                    var globalIdx = searchStart + result.idx;
                    var beforeTag = thinkBuf.substring(0, globalIdx);
                    var afterTag = thinkBuf.substring(globalIdx + result.len);
                    thinkText = beforeTag;
                    chunk = afterTag;
                    thinkBuf = '';
                    inThink = false;
                  }

                  // Update live think block
                  if (thinkText) {
                    ensureThinkBlock();
                    var tc = document.getElementById('liveThinkContent');
                    var tb = document.getElementById('liveThinkBadge');
                    if (tc) tc.textContent = thinkText;
                    if (tb) tb.textContent = thinkText.length + ' 字';
                  }
                }
              }

              if (chunk) {
                fullText += chunk;
                // 单节点：流式渲染（150ms 节流）；分布式：右栏只累计，完成时整体显示
                if (!(currentMeta && currentMeta.split) && !window._renderTimer) {
                  window._renderTimer = setTimeout(function () {
                    window._renderTimer = null;
                    var so = document.getElementById('streamOutput');
                    if (so) { so.innerHTML = renderMarkdown(fullText); }
                    // 跟随滚动并入渲染节流，避免每个文本事件触发布局抖动
                    var rc = document.getElementById('colRight');
                    if (rc && rc.scrollHeight - rc.scrollTop - rc.clientHeight < 160) {
                      rc.scrollTop = rc.scrollHeight;
                    }
                  }, 150);
                }
              }

              var status;
              if (currentMeta && currentMeta.split) {
                status = lastProgress ? ('分项分析中…（' + lastProgress.done + '/' + lastProgress.total + '）') : '分项分析中…';
              } else {
                status = inThink ? ('思考中… (' + thinkText.length + ' 字)') : ('正在分析… (' + fullText.length + ' 字)');
              }
              document.getElementById('streamStatus').textContent = status;
            } else if (data.type === 'charts') {
              chartsContainer.innerHTML = '';
              if (data.images && data.images.length > 0) {
                data.images.forEach(function (img) {
                  var item = document.createElement('div');
                  item.className = 'chart-item';
                  var hdr = document.createElement('div');
                  hdr.className = 'chart-item-header';
                  hdr.textContent = img[0] || '图表';
                  var imgEl = document.createElement('img');
                  imgEl.src = img[1];
                  imgEl.alt = img[0] || '图表';
                  imgEl.loading = 'lazy';
                  item.appendChild(hdr);
                  item.appendChild(imgEl);
                  chartsContainer.appendChild(item);
                });
              }
            } else if (data.type === 'error') {
              showError(data.content);
            } else if (data.type === 'done') {
              gotDone = true;
              // Combine think (from SSE events) + output for final render
              var finalOut;
              if (thinkText && !fullText) {
                // Only think, no output — treat everything as body
                finalOut = thinkText;
              } else if (thinkText) {
                // SSE think + text output — wrap think in tags for proper fold
                finalOut = '<think>' + thinkText + '</think>\n' + fullText;
              } else {
                finalOut = fullText;
              }
              // Flush pending render
              if (window._renderTimer) { clearTimeout(window._renderTimer); window._renderTimer = null; }
              if (window._midTimer) { clearTimeout(window._midTimer); window._midTimer = null; }
              midRender();
              (document.getElementById('streamOutput') || {}).innerHTML = renderMarkdown(fullText);

              var mbar = document.getElementById('metaProgressBar');
              if (lastProgress) {
                var mp = document.getElementById('metaProgress');
                if (mp) mp.textContent = '分项分析完成（' + lastProgress.done + '/' + lastProgress.total + '）';
                if (mbar) mbar.style.width = '100%';
              } else if (mbar) {
                // 单节点模式：不定进度条收满
                mbar.classList.remove('indeterminate');
                mbar.style.width = '100%';
              }
              document.getElementById('streamStatus').textContent = '分析完成';
              renderResult(finalOut);
              // 收集当前会话（报告/思考/图表/元信息），供导出 JSON
              currentSession = {
                question: questionInput.value.trim(),
                files: selectedFiles.map(function (fi) { return fi.name; }),
                outputText: fullText,
                thinkText: thinkText,
                images: [],
                meta: currentMeta,
                chat: []
              };
              chartsContainer.querySelectorAll('.chart-item img').forEach(function (img) {
                currentSession.images.push([img.alt || '图表', img.src]);
              });
              loadingContainer.classList.remove('active');
              submitBtn.disabled = false;
              submitBtn.classList.remove('btn-stop');
              // 分析完成 → 显示追问面板（会话有效时），主按钮切换为"追问"
              // （必须先复位按钮，再 setSubmitMode，否则会被上面的复位覆盖回"开始分析"）
              var cp = document.getElementById('chatPanel');
              if (cp && chatSessionId) {
                cp.classList.add('active');
                document.getElementById('chatInput').focus();
                setSubmitMode(true);
              } else {
                setSubmitMode(false);
              }
              syncChatBall();
              return;
            }
          });

          return read();
        });
      }

      return read();
    }).catch(function (err) {
      if (err.name === 'AbortError') {
        loadingContainer.classList.remove('active');
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-stop');
        submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始分析';
        clearMetaBadge();
        return;
      }
      loadingContainer.classList.remove('active');
      submitBtn.disabled = false;
      submitBtn.classList.remove('btn-stop');
      submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始分析';
      showError('分析失败：' + (err.message || '网络错误'));
    });
  });

  // Intercept submit button during streaming: stop
  submitBtn.addEventListener('click', function (e) {
    if (submitBtn.classList.contains('btn-stop') && currentAbortController) {
      e.stopImmediatePropagation();
      currentAbortController.abort();
      currentAbortController = null;

  // ── Report rendering (think + output split) ──
  function parseThinkAndOutput(text) {
    // Priority: <Answer>...</Answer> tag -> output, rest is thinking
    var answerRe = /<\s*Answer\s*>([\s\S]*?)<\s*\/\s*Answer\s*>/i;
    var answerMatch = text.match(answerRe);

    if (answerMatch) {
      var thinkText = text.replace(answerRe, '').trim();
      // Also clean up the report header/footer from the thinking part
      // Remove lines like ====, ----, file info, report end, etc.
      thinkText = thinkText
        .replace(/={3,}[\s\S]*?={3,}/g, '')
        .replace(/-{3,}[\s\S]*?-{3,}/g, '')
        .replace(/分析文件[\s\S]*?数据总量[^\n]*\n/g, '')
        .trim();
      var outputText = answerMatch[1].trim();
      return { think: thinkText, output: outputText };
    }

    // Fallback: standard  ...  tags
    var thinkRe = /<\s*think\s*>([\s\S]*?)<\s*\/\s*think\s*>/i;
    var thinkMatch = text.match(thinkRe);
    if (thinkMatch) {
      var tThink = thinkMatch[1].trim();
      var tOutput = text.replace(thinkRe, '').trim().replace(/\n{3,}/g, '\n\n');
      return { think: tThink, output: tOutput };
    }

    // Fallback: any non-standard reasoning tags (Analyze, Understand, Reasoning, etc.)
    // Everything except the last answer-like section is thinking
    var multiTagRe = /<\s*(Analyze|Understand|Reasoning|思考|分析|理解|Planning|Plan)\s*>[\s\S]*?<\s*\/\s*\1\s*>/gi;
    var tagMatch = text.match(multiTagRe);
    if (tagMatch && tagMatch.length > 0) {
      // Extract all tagged sections as thinking
      var allThink = tagMatch.map(function (m) {
        var innerRe = /<\s*[^>]+\s*>([\s\S]*?)<\s*\/\s*[^>]+\s*>/i;
        var inner = m.match(innerRe);
        return inner ? inner[1].trim() : m;
      }).join('\n\n');

      // Remove all tag blocks from text, what remains is output
      var remaining = text;
      tagMatch.forEach(function (m) {
        remaining = remaining.replace(m, '');
      });
      remaining = remaining.trim().replace(/\n{3,}/g, '\n\n');

      // If remaining is empty or just header/footer lines, use entire text after tags
      if (!remaining || remaining.length < 50) {
        remaining = text;
        tagMatch.forEach(function (m) {
          remaining = remaining.replace(m, '');
        });
        remaining = remaining.replace(/={3,}[\s\S]*?={3,}/g, '').replace(/-{3,}[\s\S]*?-{3,}/g, '').trim();
        remaining = remaining.replace(/\n{3,}/g, '\n\n');
      }

      return { think: allThink, output: remaining };
    }

    return { think: '', output: text };
  }

  // ── Vanilla Markdown → HTML renderer ──
  function renderMarkdown(text) {
    // Escape HTML entities
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Extract and protect code blocks
    var codeBlocks = [];
    var html = text.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
      codeBlocks.push('<pre><code class="lang-' + esc(lang) + '">' + esc(code.trimEnd()) + '</code></pre>');
      return '\x00CODE' + (codeBlocks.length - 1) + '\x00';
    });

    // Escape remaining text
    html = esc(html);

    // Restore code blocks
    html = html.replace(/\x00CODE(\d+)\x00/g, function (_, i) { return codeBlocks[parseInt(i)]; });

    // Tables (must come before hr)
    html = html.replace(/^\|(.+)\|\n\|[-\s|:]+\|\n((?:^\|.+\|\n?)+)/gm, function (_, header, rows) {
      var hcells = header.split('|').map(function (c) { return '<th>' + c.trim() + '</th>'; }).join('');
      var rrows = rows.trim().split('\n').map(function (r) {
        return '<tr>' + r.split('|').filter(function (c) { return c !== ''; }).map(function (c) {
          return '<td>' + c.trim() + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return '<table><thead><tr>' + hcells + '</tr></thead><tbody>' + rrows + '</tbody></table>';
    });

    // Headings
    html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
    html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
    html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    // Horizontal rule
    html = html.replace(/^---$/gm, '<hr>');
    html = html.replace(/^\*\*\*$/gm, '<hr>');
    html = html.replace(/^___$/gm, '<hr>');

    // Bold-italic, bold, italic
    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

    // Inline code (not inside pre)
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Unordered lists: group consecutive <li> and wrap in <ul>
    html = html.replace(/^[*-] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, function (match) {
      return '<ul>' + match.replace(/\n/g, '') + '</ul>';
    });

    // Ordered lists
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Re-wrap any remaining <li> groups in <ol> (those that aren't already in <ul>)
    html = html.replace(/<li>/g, '\x00LI\x00');
    html = html.replace(/<\/li>/g, '\x00/LI\x00');
    html = html.replace(/(\x00LI\x00(?:[^\x00]*?)\x00\/LI\x00\s*)+/g, function (match) {
      if (match.indexOf('<ul>') === -1) {
        return '<ol>' + match.replace(/\x00LI\x00/g, '<li>').replace(/\x00\/LI\x00/g, '</li>').replace(/\n/g, '') + '</ol>';
      }
      return match.replace(/\x00LI\x00/g, '<li>').replace(/\x00\/LI\x00/g, '</li>');
    });
    html = html.replace(/\x00LI\x00/g, '<li>').replace(/\x00\/LI\x00/g, '</li>');

    // Links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

    // Paragraphs: split on double newlines, wrap non-block elements in <p>
    var blocks = html.split(/\n\n+/);
    html = blocks.map(function (block) {
      block = block.trim();
      if (!block) return '';
      // Don't wrap block-level elements
      if (/^<(h[1-6]|ul|ol|li|table|pre|hr|div|blockquote)/.test(block)) {
        return block;
      }
      // Replace single newlines with <br> within paragraphs
      block = block.replace(/\n/g, '<br>');
      return '<p>' + block + '</p>';
    }).join('\n');

    // Clean up empty paragraphs
    html = html.replace(/<p>\s*<\/p>/g, '');
    html = html.replace(/<p><br>\s*<\/p>/g, '');

    return html;
  }

  function renderResult(text) {
    var parsed = parseThinkAndOutput(text);
    resultContent.innerHTML = '';

    if (parsed.think) {
      var block = document.createElement('div');
      block.className = 'think-block';

      var toggle = document.createElement('button');
      toggle.className = 'think-toggle';
      toggle.innerHTML = '<span class="arrow">&#9654;</span> 思考过程 <span class="think-badge">' +
        parsed.think.length + ' 字</span>';

      var content = document.createElement('div');
      content.className = 'think-content';
      content.textContent = parsed.think;

      toggle.addEventListener('click', function () {
        block.classList.toggle('open');
      });

      block.appendChild(toggle);
      block.appendChild(content);
      resultContent.appendChild(block);
    }

    if (parsed.output) {
      var label = document.createElement('div');
      label.className = 'output-label';
      label.textContent = parsed.think ? '分析结果' : '';

      var outputDiv = document.createElement('div');
      outputDiv.className = 'output-block';
      outputDiv.innerHTML = renderMarkdown(parsed.output);

      if (label.textContent) resultContent.appendChild(label);
      resultContent.appendChild(outputDiv);
    }
  }

  // ── Copy (only output when think is collapsed) ──
  copyBtn.addEventListener('click', function () {
    // If think block exists and is collapsed, only copy output
    var thinkBlock = resultContent.querySelector('.think-block');
    var thinkVisible = thinkBlock && thinkBlock.classList.contains('open');
    var outputBlock = resultContent.querySelector('.output-block');

    var text;
    if (thinkBlock && !thinkVisible && outputBlock) {
      // Think collapsed: copy only output
      text = outputBlock.textContent || '';
    } else {
      // Think expanded or no think block: copy everything
      text = resultContent.textContent || '';
    }

    if (!text) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        var orig = copyBtn.innerHTML;
        copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> 已复制';
        setTimeout(function () { copyBtn.innerHTML = orig; }, 2000);
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      var orig = copyBtn.innerHTML;
      copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> 已复制';
      setTimeout(function () { copyBtn.innerHTML = orig; }, 2000);
    } catch (e) {
      showError('复制失败，请手动选择文本复制');
    }
    document.body.removeChild(ta);
  }

  // ── 分析模式徽标（单节点 / 分布式 + 节点列表 + 分项进度） ──
  function renderMetaBadge(meta) {
    var el = document.getElementById('analysisMeta');
    if (!el) return;
    // 单节点/分布式都逐表处理，统一显示确定进度（分项分析 N/M + 填充条）
    var pill = meta.mode === 'distributed'
      ? '<span class="meta-pill meta-distributed">分布式模式</span>'
      : '<span class="meta-pill meta-single">单节点模式</span>';
    var nodes = meta.mode === 'distributed'
      ? '<span class="meta-nodes">' + escHtml((meta.nodes || []).join('、')) + '</span>'
      : '';
    el.innerHTML = pill + nodes +
      '<span class="meta-progress" id="metaProgress">分项分析 0/0</span>' +
      '<div class="meta-progress-wrap"><div class="meta-progress-bar" id="metaProgressBar"></div></div>';
    el.classList.add('active');
  }

  function updateMetaProgress(p) {
    var el = document.getElementById('metaProgress');
    if (el) el.textContent = '分项分析 ' + p.done + '/' + p.total;
    var bar = document.getElementById('metaProgressBar');
    if (bar) bar.style.width = Math.round(p.done / p.total * 100) + '%';
  }

  function clearMetaBadge() {
    var el = document.getElementById('analysisMeta');
    if (!el) return;
    el.classList.remove('active');
    el.innerHTML = '';
  }

  // ── 节点工作内容（中栏） ──
  var midCards = [];
  var midCurrent = null;

  function midReset(placeholder) {
    midCards = [];
    midCurrent = null;
    var nc = document.getElementById('nodeContent');
    if (nc) nc.innerHTML = '<div class="node-placeholder">' + (placeholder || '等待分析…') + '</div>';
  }

  function midAddCard(title, node, raw) {
    var nc = document.getElementById('nodeContent');
    var card = document.createElement('div');
    card.className = 'node-card';
    var hdr = document.createElement('div');
    hdr.className = 'node-card-header';
    hdr.textContent = title + '（节点：' + node + '）';
    var body = document.createElement('div');
    body.className = 'node-card-body';
    card.appendChild(hdr);
    card.appendChild(body);
    nc.appendChild(card);
    var rec = { title: title, node: node, raw: raw || '', body: body, dirty: true };
    midCards.push(rec);
    return rec;
  }

  function midRender() {
    // 只重渲染有更新的卡片，避免每次全量解析几十 KB markdown 卡死主线程
    midCards.forEach(function (rec) {
      if (!rec.dirty) return;
      rec.dirty = false;
      var st = rec.body.scrollTop;  // 保留滚动位置，重渲染不跳回顶部
      rec.body.innerHTML = renderMarkdown(rec.raw);
      rec.body.scrollTop = st;
    });
    // 中栏跟随滚动（用户已上翻查看时不强制拉回）
    var col = document.getElementById('colMid');
    if (col && col.scrollHeight - col.scrollTop - col.clientHeight < 160) {
      col.scrollTop = col.scrollHeight;
    }
  }

  // ── 二次追问聊天 ──
  var chatSessionId = null;
  var chatBusy = false;
  // 当前会话（内存）：报告文本、图表、追问记录——用于导出/导入 JSON
  var currentSession = null;

  function chatAppend(role, text) {
    var t = document.getElementById('chatThread');
    var m = document.createElement('div');
    m.className = 'chat-msg ' + role;
    if (text) m.innerHTML = renderMarkdown(text);
    t.appendChild(m);
    t.scrollTop = t.scrollHeight;
    return m;
  }

  function chatReset() {
    chatSessionId = null;
    chatBusy = false;
    var cp = document.getElementById('chatPanel');
    if (cp) cp.classList.remove('active');
    var t = document.getElementById('chatThread');
    if (t) t.innerHTML = '';
    var inp = document.getElementById('chatInput');
    if (inp) inp.value = '';
    syncChatBall();
  }

  // 悬浮球显隐：有会话且面板收起时显示，面板打开或会话失效时隐藏
  function syncChatBall() {
    var ball = document.getElementById('chatBall');
    var panel = document.getElementById('chatPanel');
    if (!ball || !panel) return;
    ball.classList.toggle('show', !!chatSessionId && !panel.classList.contains('active'));
  }

  // 临时诊断条：默认隐藏、后台持续记录；点击底部 footer 的"QuantView"切换显示/隐藏
  function diagLog(msg) {
    var el = document.getElementById('diagStrip');
    if (!el) {
      el = document.createElement('div');
      el.id = 'diagStrip';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#111;color:#0f0;font:12px/1.5 monospace;padding:4px 8px;white-space:pre-wrap;max-height:40vh;overflow-y:auto;display:none;';
      document.body.appendChild(el);
    }
    var line = document.createElement('div');
    line.textContent = new Date().toISOString().slice(11, 19) + ' ' + msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }
  var diagToggleEl = document.getElementById('diagToggle');
  if (diagToggleEl) diagToggleEl.addEventListener('click', function (e) {
    e.stopPropagation();
    var el = document.getElementById('diagStrip');
    if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
  });

  function chatSend(optQ) {
    var inp = document.getElementById('chatInput');
    // 点击"发送"按钮时浏览器会把 event 对象传进来（typeof !== 'string'），此时回退读取输入框
    var q = (typeof optQ === 'string' ? optQ : inp.value).trim();
    if (!q || chatBusy) return;
    if (!chatSessionId) {
      // 会话不可用时给出可见提示，避免静默无反应
      if (optQ === undefined) inp.value = '';
      var nb = chatAppend('assistant', '');
      nb.innerHTML = '<span style="color:var(--warning);">⚠️ 追问会话不可用（页面已刷新或会话已过期），请重新发起分析后再追问。</span>';
      return;
    }
    chatBusy = true;
    diagLog('chatSend q=' + q + ' session=' + String(chatSessionId).slice(0, 8)
      + ' panel=' + !!document.getElementById('chatPanel')
      + ' thread=' + (document.getElementById('chatThread') ? document.getElementById('chatThread').children.length : -1)
      + ' panelVisible=' + (function () { var p = document.getElementById('chatPanel'); return !!(p && p.offsetParent !== null); })());
    // 确保追问面板可见（悬浮窗固定在视口右下角，激活即显示）
    var cpn = document.getElementById('chatPanel');
    if (cpn) cpn.classList.add('active');
    syncChatBall();
    if (optQ === undefined) inp.value = '';
    chatAppend('user', q);
    if (currentSession) { currentSession.chat = currentSession.chat || []; currentSession.chat.push({ role: 'user', text: q }); }
    var bubble = chatAppend('assistant', '');
    var full = '';
    var lastRender = 0;
    var gotChunk = false;
    // 模型可能需数秒~数分钟才开始输出（大上下文预填充）——立即显示"正在回答…"并每秒更新等待时长，避免看起来无反应
    renderBubble();
    var waitStart = Date.now();
    var waitTimer = setInterval(function () {
      if (full || !bubble.parentNode) { clearInterval(waitTimer); return; }
      var secs = Math.round((Date.now() - waitStart) / 1000);
      bubble.innerHTML = '<span style="color:var(--text-muted);">正在回答…（已等待 ' + secs + ' 秒，模型预填充较慢属正常）</span>';
    }, 1000);
    // 若长时间收不到任何内容，提示可能仍在处理/排队，避免用户误以为卡死
    var slowTimer = setTimeout(function () {
      if (!gotChunk && bubble.parentNode) {
        bubble.innerHTML = '<span style="color:var(--warning);">模型响应较慢（可能仍在处理之前的请求或预填充较长上下文），请再等待一会儿…</span>';
      }
    }, 90000);

    function recordAssistant() {
      if (currentSession) { currentSession.chat = currentSession.chat || []; currentSession.chat.push({ role: 'assistant', text: full || '（无回复）' }); }
    }
    function renderBubble() {
      if (bubble.parentNode) {
        bubble.innerHTML = full
          ? renderMarkdown(full)
          : '<span style="color:var(--text-muted);">正在回答…</span>';
      }
      var t = document.getElementById('chatThread');
      if (t) t.scrollTop = t.scrollHeight;
    }
    function scheduleRender() {
      var now = Date.now();
      if (now - lastRender > 200) { lastRender = now; renderBubble(); }
      else { setTimeout(renderBubble, 200); }
    }

    fetch('/analyze/followup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: chatSessionId, question: q })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (e) { throw new Error(e.error || 'HTTP ' + r.status); });
      }
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var chunkCount = 0;
      function read() {
        return reader.read().then(function (res) {
          if (res.done) {
            if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
            if (!full) { full = '（无回复：模型未返回内容，请重试）'; }
            renderBubble(); chatBusy = false; recordAssistant();
            diagLog('done: full=' + full.length + ' 块数=' + chunkCount + ' bubbleKids=' + (bubble.children.length + (bubble.innerHTML ? 1 : 0)));
            return;
          }
          buffer += decoder.decode(res.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop();
          lines.forEach(function (line) {
            if (!line.startsWith('data: ')) return;
            var d; try { d = JSON.parse(line.substring(6)); } catch (e) { return; }
            if (d.type === 'text') { full += d.content; gotChunk = true; chunkCount++; if (chunkCount % 20 === 0) { diagLog('已收 ' + chunkCount + ' 块 full=' + full.length); } scheduleRender(); }
            else if (d.type === 'error') { full += '\n⚠️ ' + d.content; }
          });
          return read();
        });
      }
      return read();
    }).catch(function (err) {
      if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
      full = '⚠️ ' + (err.message || '网络错误');
      renderBubble();
      chatBusy = false;
      recordAssistant();
      diagLog('catch: ' + err.message);
    });
  }

  function escHtml(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

  // ── 会话导出 / 导入（JSON，代替历史会话） ──
  var exportSessionBtn = document.getElementById('exportSessionBtn');
  var importSessionBtn = document.getElementById('importSessionBtn');
  var importSessionFile = document.getElementById('importSessionFile');

  // 从报告文本重建中栏节点卡片（导入会话时使用）
  function midRebuildFromText(text) {
    midReset('');
    if (!text) return;
    var re = /^### 工作表「(.+?)」分析（节点：(.+?)）\n\n([\s\S]*?)(?=^### 工作表「|^## 总览与综合结论|$)/gm;
    var m;
    while ((m = re.exec(text)) !== null) {
      midAddCard(m[1], m[2], m[3].trim());
    }
    var ov = text.match(/^## 总览与综合结论（主节点生成）\n\n([\s\S]*?)(?=^### 工作表「|$)/m);
    if (ov) midAddCard('总览与综合结论', '主节点', ov[1].trim());
    if (!midCards.length) { midReset('无分节点内容'); return; }
    midRender();
  }

  exportSessionBtn.addEventListener('click', function () {
    if (!currentSession || !currentSession.outputText) { showError('当前会话无可导出的内容（先完成一次分析）'); return; }
    var payload = {
      version: 1, app: 'QuantView',
      question: currentSession.question || '',
      files: currentSession.files || [],
      time: new Date().toLocaleString('zh-CN'),
      outputText: currentSession.outputText,
      thinkText: currentSession.thinkText || '',
      images: currentSession.images || [],
      meta: currentSession.meta || null,
      chat: currentSession.chat || []
    };
    var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'QuantView_会话_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importSessionBtn.addEventListener('click', function () { importSessionFile.click(); });
  importSessionFile.addEventListener('change', function () {
    var f = importSessionFile.files && importSessionFile.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s || !s.outputText) throw new Error('bad');
        restoreSession(s);
      } catch (e) {
        showError('会话文件无效或已损坏');
      }
      importSessionFile.value = '';
    };
    rd.readAsText(f);
  });

  function restoreSession(s) {
    currentSession = s;
    currentSession.chat = currentSession.chat || [];
    loadingContainer.classList.remove('active');
    submitBtn.disabled = false;
    submitBtn.classList.remove('btn-stop');
    submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始分析';
    resultSection.classList.add('active');
    clearMetaBadge();
    if (s.meta) {
      renderMetaBadge(s.meta);
      var mp = document.getElementById('metaProgress');
      if (mp) mp.textContent = '分项分析完成';
      var mbar = document.getElementById('metaProgressBar');
      if (mbar) { mbar.classList.remove('indeterminate'); mbar.style.width = '100%'; }
    }
    var fo = (s.thinkText ? '<think>' + s.thinkText + '</think>\n' : '') + (s.outputText || '');
    renderResult(fo);
    chartsContainer.innerHTML = '';
    (s.images || []).forEach(function (img) {
      var item = document.createElement('div'); item.className = 'chart-item';
      var h = document.createElement('div'); h.className = 'chart-item-header'; h.textContent = img[0] || '图表';
      var ie = document.createElement('img'); ie.src = img[1]; ie.alt = img[0] || '图表'; ie.loading = 'lazy';
      item.appendChild(h); item.appendChild(ie); chartsContainer.appendChild(item);
    });
    if (s.meta && s.meta.split) {
      midRebuildFromText(s.outputText);
    } else {
      midReset('单节点模式：无分节点工作内容');
    }
    // 追问会话恢复：meta.session 存在即可继续追问（同一服务端的会话仍在 sessions/ 里）
    chatSessionId = (s.meta && s.meta.session) || null;
    chatBusy = false;
    var cp2 = document.getElementById('chatPanel');
    var ct2 = document.getElementById('chatThread');
    if (ct2) ct2.innerHTML = '';
    if (chatSessionId && cp2) {
      (s.chat || []).forEach(function (m) {
        var d2 = document.createElement('div');
        d2.className = 'chat-msg ' + (m.role === 'user' ? 'user' : 'assistant');
        if (m.text) d2.innerHTML = renderMarkdown(m.text);
        ct2.appendChild(d2);
      });
      cp2.classList.add('active');
      setSubmitMode(true);
      // 追问面板在右栏底部，报告较长时看不到——直接滚动到面板并聚焦输入框
      if (ct2 && !ct2.children.length) {
        var hint = document.createElement('div');
        hint.className = 'chat-msg assistant';
        hint.innerHTML = '<span style="color:var(--text-muted);">该会话暂无追问记录，可直接在下方输入问题继续追问。</span>';
        ct2.appendChild(hint);
      }
      var ci = document.getElementById('chatInput');
      if (ci) setTimeout(function () { ci.focus(); }, 400);
    } else if (cp2) {
      cp2.classList.remove('active');
      setSubmitMode(false);
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    syncChatBall();
  }

  // ── Download as .md ──
  downloadBtn.addEventListener('click', function () {
    var text = '';
    var ob = resultContent.querySelector('.output-block');
    if (ob) text = ob.textContent || '';
    if (!text) text = resultContent.textContent || '';

    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'QuantView_' + new Date().toISOString().slice(0,10) + '.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ── Download as Word ──
  var wordBtn = document.getElementById('downloadWordBtn');
  if (wordBtn) {
    wordBtn.onclick = function () {
      var ob = document.querySelector('.output-block');
      var html = ob ? (ob.innerHTML || '') : '';
      if (!html) { showError('无内容可导出'); return; }
      // 把 chartjson 代码块替换为已渲染的图表图片（按图表标题匹配，匹配不到的块直接移除）
      var images = [];
      chartsContainer.querySelectorAll('.chart-item').forEach(function (it) {
        var im = it.querySelector('img');
        if (im) images.push([im.alt || '图表', im.src]);
      });
      html = html.replace(/<pre><code class="lang-chartjson">[\s\S]*?<\/code><\/pre>/g, function (m) {
        var raw = m.replace(/^<pre><code class="lang-chartjson">/, '').replace(/<\/code><\/pre>$/, '')
                   .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
        var specs = null;
        try { specs = JSON.parse(raw); }
        catch (e) {
          try { specs = JSON.parse(raw.replace(/,\s*([\]}])/g, '$1')); }
          catch (e2) { specs = null; }
        }
        if (!specs || !specs.length) return '';
        var imgs = [];
        specs.forEach(function (sp) {
          if (!sp || !sp.title) return;
          for (var i = 0; i < images.length; i++) {
            if (images[i][0] === sp.title) { imgs.push('<img src="' + images[i][1] + '">'); break; }
          }
        });
        return imgs.join('\n');
      });
      wordBtn.textContent = '生成中...'; wordBtn.disabled = true;
      fetch('/export/docx', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ html: html, title: '分析报告' })
      }).then(function (r) {
        if (!r.ok) return r.json().then(function(e) { throw new Error(e.error); });
        return r.blob();
      }).then(function (b) {
        var u = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = u; a.download = 'QuantView_' + new Date().toISOString().slice(0,10) + '.docx';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(u);
      }).catch(function (e) { showError('Word导出失败：'+e.message); })
        .finally(function () {
          wordBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="6" y1="7" x2="18" y2="7"/><line x1="6" y1="11" x2="18" y2="11"/><line x1="10" y1="15" x2="18" y2="15"/></svg> 下载 Word';
          wordBtn.disabled = false;
        });
    };
  }

  // ── Theme toggle ──
  themeToggle.addEventListener('click', function () {
    toggleTheme();
  });

  // ── Keyboard shortcuts ──
  questionInput.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      submitBtn.click();
    }
  });
})();
</script>
</body>
